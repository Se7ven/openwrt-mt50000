name: Build (GL.iNet mt5000)

# Pipeline 2: builds the firmware from the GL.iNet OpenWrt repository.
#
# Source: https://github.com/GLiNet-Tech/openwrt
# Branch: mt5000 (the branch that carries the GL-MT5000 support: DTS, image
#         definition, board scripts and the RTL8366UB DSA driver).
#
# The runtime configuration that reproduces the GL.iNet defaults is added by
# the package "glinet-mt5000-defaults" (config/runtime/), the build
# configuration comes from config/buildinfo/glinet.config.buildinfo and
# config/fragments/.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag of the GL.iNet repository (default: mt5000)"
        required: false
        default: "mt5000"
      switch_driver:
        description: "Driver of the Realtek RTL8366UB switch"
        required: false
        default: "dsa"
        type: choice
        options:
          - dsa
          - swconfig
      profile:
        description: "Feature profile of the firmware"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - minimal
      jobs:
        description: "Number of parallel build jobs"
        required: false
        default: "8"
      strict_patches:
        description: "Abort the build if a patch does not apply"
        required: false
        default: "true"
        type: boolean
  push:
    branches: [main]
    paths:
      - "patches/glinet/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/build-glinet.yml"
  schedule:
    - name: nightly snapshot build
      cron: "17 4 * * *"

permissions:
  contents: write

env:
  BUILDER_ROOT: "${{ github.workspace }}"
  WORK_DIR: "${{ github.workspace }}/build"

jobs:
  build:
    name: GL.iNet ${{ inputs.ref || 'mt5000' }} (${{ inputs.switch_driver || 'dsa' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout the builder repository
        uses: actions/checkout@v4

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            "/usr/local/share/boost" "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - name: Cache the OpenWrt download cache
        uses: actions/cache@v4
        with:
          path: |
            build/openwrt/dl
            build/ccache
          key: glinet-${{ inputs.ref || 'mt5000' }}-${{ inputs.switch_driver || 'dsa' }}-${{ hashFiles('config/**', 'patches/**') }}
          restore-keys: |
            glinet-${{ inputs.ref || 'mt5000' }}-${{ inputs.switch_driver || 'dsa' }}-
            glinet-

      - name: Build the firmware
        env:
          CCACHE_DIR: "${{ github.workspace }}/build/ccache"
          DEBIAN_FRONTEND: noninteractive
          # the build stamp is used in the name of the release and of the files
          BUILD_STAMP: "$(date -u +%Y%m%d-%H%M)"
        run: |
          mkdir -p build
          ./scripts/build.sh \
            --workdir "${WORK_DIR}" \
            --source glinet \
            --ref "${{ inputs.ref || 'mt5000' }}" \
            --flavour glinet \
            --switch-driver "${{ inputs.switch_driver || 'dsa' }}" \
            --profile "${{ inputs.profile || 'full' }}" \
            --jobs "${{ inputs.jobs || '8' }}" \
            --stamp "${BUILD_STAMP}" \
            $([ "${{ inputs.strict_patches == false }}" = "true" ] && echo "--no-strict" || echo "--strict")

      - name: Collect the artifacts
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d "${WORK_DIR}/out" ]; then
            cp -a "${WORK_DIR}/out/." artifacts/ || true
          fi
          if [ -f "${WORK_DIR}/openwrt/.config" ]; then
            cp -f "${WORK_DIR}/openwrt/.config" artifacts/config-used.config || true
          fi
          ls -la artifacts

      - name: Create the release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f artifacts/release.json ]; then
            echo "::warning::no release metadata - the release is not created"
            exit 0
          fi
          TAG="$(python3 -c "import json;print(json.load(open('artifacts/release.json'))['tag'])")"
          NAME="$(python3 -c "import json;print(json.load(open('artifacts/release.json'))['name'])")"
          echo "::notice::creating the release ${TAG}"
          NOTES="$(mktemp)"
          {
            cat artifacts/release.md
            echo
            echo "### Файлы релиза"
            echo
            echo '```'
            ls -1 artifacts/ | grep -vE "^(release\.json|release\.md)$"
            echo '```'
          } > "${NOTES}"
          FILES="$(ls artifacts/ | grep -vE "^(release\.json|release\.md)$" | sed 's|^|artifacts/|' | tr '\n' ' ')"
          # shellcheck disable=SC2086
          gh release create "${TAG}" ${FILES} \
            --title "${NAME}" \
            --notes-file "${NOTES}" \
            || gh release upload "${TAG}" --clobber ${FILES}

      - name: Upload the artifacts to the workflow
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-glinet-${{ inputs.ref || 'mt5000' }}-${{ inputs.switch_driver || 'dsa' }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
